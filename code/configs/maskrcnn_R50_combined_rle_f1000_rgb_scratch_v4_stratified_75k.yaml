_BASE_: /scratch2/pr65/anur0018/conda_envs/maskdino/lib/python3.9/site-packages/detectron2/model_zoo/configs/COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x.yaml

# Mask R-CNN R50-FPN, RGB (3ch) FROM-SCRATCH (TANPA DBH, TANPA pretrained weights) — pasangan
# matched-initialisation untuk maskrcnn_R50_combined_rle_f1000_rgbd_scratch_v4_stratified_75k.yaml.
# Tujuan: mengisolasi kontribusi murni kanal depth utk arsitektur Mask R-CNN (ROI-based), sejalan
# dgn Table 2 tesis (matched-init RGB vs RGB-D) yang sejauh ini hanya berisi backbone MaskDINO.
# Varian pretrained (maskrcnn_R50_combined_rle_f1000_rgb_pretrained_v4_stratified_75k.yaml) TIDAK
# admissible utk perbandingan ini karena RGB-nya pretrained sementara RGB-D-nya scratch — confound
# inisialisasi. Self-contained: scripts/maskrcnn_rgbd_dbh/train.py.
#
# CATATAN JUJUR soal komparabilitas:
#  - Sama seperti pasangan RGBD-scratch-nya: augmentasi ResizeShortestEdge klasik (bukan replikasi
#    LSJ 640 MaskDINO persis).
#  - TANPA DBH head — perbandingan murni segmentasi.
#  - MODEL.WEIGHTS dikosongkan (stem+backbone+semua head random init). PIXEL_STD DIISI EKSPLISIT
#    (bukan dibiarkan default _BASE_) — default Detectron2 PIXEL_STD=[1,1,1] hanya valid kalau
#    memuat bobot pretrained Caffe2/MSRA (std sudah "terserap" ke conv1 pretrained-nya, lihat
#    komentar di detectron2/config/defaults.py). Karena run ini WEIGHTS="", std=1 membuat input
#    tetap berskala ±100+ alih-alih dinormalisasi ke ±2, meledakkan aktivasi di jaringan
#    random-init dalam beberapa iterasi pertama (FloatingPointError Inf/NaN, terkonfirmasi smoke
#    test 20 Agt 2026 — divergen di iter~8). Nilai PIXEL_STD 3-channel di bawah disamakan dengan
#    3 channel pertama pasangan RGBD-scratch-nya supaya kedua arm benar-benar hanya beda di
#    jumlah kanal input, bukan skala normalisasi.
#  - AMP DIMATIKAN + WARMUP diperpanjang (5000 iter) — replikasi persis mitigasi risiko yang sudah
#    dipakai di pasangan RGBD-scratch (lihat catatan di config tsb, [[project-fromscratch-rgbd-amp-nan]]),
#    supaya kedua arm benar-benar hanya beda di jumlah kanal input.
#  - BELUM PERNAH DIJALANKAN DI GPU sebelum sesi ini — smoke test WAJIB sebelum full run.

MODEL:
  WEIGHTS: ""
  PIXEL_STD: [58.395, 57.120, 57.375]
  ROI_HEADS:
    NUM_CLASSES: 13

DATASETS:
  TRAIN: ("combined_inst_rle_f1000_repaired_v4_stratified_train",)
  TEST:  ("combined_inst_rle_f1000_repaired_v4_stratified_val",)

INPUT:
  FORMAT: "RGB"
  MASK_FORMAT: "bitmask"
  USE_DEPTH: False
  MIN_SIZE_TRAIN: (640,)
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MAX_SIZE_TRAIN: 1280
  MIN_SIZE_TEST: 640
  MAX_SIZE_TEST: 1280

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.005
  MAX_ITER: 75000
  STEPS: (60000, 70000)
  WARMUP_ITERS: 5000
  CHECKPOINT_PERIOD: 5000
  AMP:
    ENABLED: False

TEST:
  EVAL_PERIOD: 5000

DATALOADER:
  NUM_WORKERS: 8
  FILTER_EMPTY_ANNOTATIONS: True
