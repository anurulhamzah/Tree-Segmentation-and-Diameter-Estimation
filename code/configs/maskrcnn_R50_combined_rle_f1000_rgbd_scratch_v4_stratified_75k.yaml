_BASE_: /scratch2/pr65/anur0018/conda_envs/maskdino/lib/python3.9/site-packages/detectron2/model_zoo/configs/COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x.yaml

# Mask R-CNN R50-FPN, RGBD (4ch) FROM-SCRATCH (TANPA DBH, TANPA pretrained weights) — baseline
# arsitektur-silang utk dibandingkan dgn "FocalNet-L RGBD Scratch" (model MaskDINO terbaik
# keseluruhan, test AP50=57,18%). Sejalan dgn Bagian A.3/A.4 Report_Juli_2026_FocalNet.html
# (RGBD scratch vs RGB pretrained) tapi utk arsitektur ROI-based, bukan query-based.
# Self-contained: scripts/maskrcnn_rgbd_dbh/train.py (register_* proyek + detectron2 saja).
#
# CATATAN JUJUR soal komparabilitas:
#  - Sama seperti varian RGB-pretrained (maskrcnn_R50_combined_rle_f1000_rgb_pretrained_v4_stratified_75k.yaml):
#    augmentasi ResizeShortestEdge klasik (bukan replikasi LSJ 640 MaskDINO persis).
#  - TANPA DBH head — perbandingan murni segmentasi. Kalau nanti perlu varian +DBH, pakai
#    maskrcnn_R50_combined_rle_f1000_rgbd_dbh_v4_stratified_75k.yaml (sudah ada, beda track).
#  - MODEL.WEIGHTS dikosongkan (stem+backbone+semua head random init) — konsisten dgn cara
#    MaskDINO scratch (WEIGHTS="").
#  - AMP DIMATIKAN + WARMUP diperpanjang (5000 iter, bukan default 1000) sbg langkah preventif:
#    [[project-fromscratch-rgbd-amp-nan]] menemukan AMP fp16 + from-scratch di MaskDINO
#    menyebabkan NaN crash ~iter292. Belum dikonfirmasi apakah Mask R-CNN rentan masalah yang
#    sama, tapi risikonya cukup mahal (75k iter, ~1-2 hari) utk tidak diantisipasi — kalau smoke
#    test AMAN, boleh dicoba AMP ON di run terpisah nanti setelah baseline ini aman.
#  - BELUM PERNAH DIJALANKAN DI GPU sebelum sesi ini — smoke test WAJIB sebelum full run.

MODEL:
  WEIGHTS: ""
  PIXEL_MEAN: [123.675, 116.280, 103.530, 118.1]
  PIXEL_STD:  [58.395, 57.120, 57.375, 50.8]
  ROI_HEADS:
    NUM_CLASSES: 13

DATASETS:
  TRAIN: ("combined_inst_rle_f1000_repaired_v4_stratified_train",)
  TEST:  ("combined_inst_rle_f1000_repaired_v4_stratified_val",)

INPUT:
  FORMAT: "RGB"
  MASK_FORMAT: "bitmask"
  USE_DEPTH: True
  DEPTH_DIR: "/scratch2/pr65/anur0018/tree_classification/data/combined/depth_pfm"
  MIN_SIZE_TRAIN: (640,)
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MAX_SIZE_TRAIN: 1280
  MIN_SIZE_TEST: 640
  MAX_SIZE_TEST: 1280

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.005
  MAX_ITER: 75000
  STEPS: (60000, 70000)
  WARMUP_ITERS: 5000
  CHECKPOINT_PERIOD: 5000
  AMP:
    ENABLED: False

TEST:
  EVAL_PERIOD: 5000

DATALOADER:
  NUM_WORKERS: 8
  FILTER_EMPTY_ANNOTATIONS: True
