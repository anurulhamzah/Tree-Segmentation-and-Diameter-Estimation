_BASE_: /scratch2/pr65/anur0018/conda_envs/maskdino/lib/python3.9/site-packages/detectron2/model_zoo/configs/COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x.yaml

# Mask R-CNN R50-FPN, RGB pretrained (standar, TANPA depth/DBH) — baseline arsitektur-silang
# (ROI-based two-stage) untuk Bagian A.2 "Performa Model RGB Pretrained pada Dataset V4
# Stratified" di Report_Juli_2026_FocalNet.html, sejajar dgn 7 model MaskDINO (R50/SwinT/B/L/
# FocalNetT/B/L, semua RGB pretrained, 75k iter, combined V4 stratified train/test).
# Self-contained: scripts/maskrcnn_rgbd_dbh/train.py (register_* proyek + detectron2 saja).
#
# CATATAN JUJUR soal komparabilitas (baca sebelum mengutip hasil sbg apple-to-apple):
#  - MaskDINO pakai augmentasi LSJ (ResizeScale 0.4-2.0x + FixedSizeCrop 640x640). Mask R-CNN di
#    sini pakai ResizeShortestEdge klasik (MIN_SIZE_TRAIN sekitar 640, MAX_SIZE_TRAIN 1280) —
#    BUKAN replikasi LSJ persis (DatasetMapper legacy detectron2 tidak native dukung ResizeScale
#    tanpa custom augmentation list). Beda resolusi/augmentasi jadi confounder yang belum
#    dikontrol penuh — laporkan sbg baseline arsitektur-silang, bukan ablasi resolusi terkontrol.
#  - Bobot pretrained: COCO Mask R-CNN R50-FPN 3x standar (BUKAN yang di-inflate 4ch — itu utk
#    varian RGBD+DBH terpisah, lihat maskrcnn_R50_combined_rle_f1000_rgbd_dbh_v4_stratified_75k.yaml).
#  - Optimizer/LR: SGD BASE_LR=0.005 (konvensi standar Mask R-CNN di batch=4), BUKAN AdamW LR
#    kecil seperti MaskDINO — practice umum masing2 arsitektur, bukan disamakan paksa.
#  - BELUM PERNAH DIJALANKAN DI GPU sebelum sesi ini — smoke test WAJIB sebelum full run.

MODEL:
  WEIGHTS: "/scratch2/pr65/anur0018/pretrained_weights/mask_rcnn_R_50_FPN_3x_coco.pkl"
  ROI_HEADS:
    NUM_CLASSES: 13

DATASETS:
  TRAIN: ("combined_inst_rle_f1000_repaired_v4_stratified_train",)
  TEST:  ("combined_inst_rle_f1000_repaired_v4_stratified_val",)

INPUT:
  FORMAT: "RGB"
  MASK_FORMAT: "bitmask"
  USE_DEPTH: False
  MIN_SIZE_TRAIN: (640,)
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MAX_SIZE_TRAIN: 1280
  MIN_SIZE_TEST: 640
  MAX_SIZE_TEST: 1280

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.005
  MAX_ITER: 75000
  STEPS: (60000, 70000)
  WARMUP_ITERS: 1000
  CHECKPOINT_PERIOD: 5000
  AMP:
    ENABLED: True

TEST:
  EVAL_PERIOD: 5000

DATALOADER:
  NUM_WORKERS: 8
  FILTER_EMPTY_ANNOTATIONS: True
