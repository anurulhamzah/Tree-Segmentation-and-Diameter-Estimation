_BASE_: /scratch2/pr65/anur0018/conda_envs/maskdino/lib/python3.9/site-packages/detectron2/model_zoo/configs/COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x.yaml

# Mask R-CNN R50-FPN + RGBD + DBH pada Combined (13 kelas), V4 STRATIFIED SPLIT — baseline
# lintas-arsitektur (ROI-based) vs MaskDINO (query-based), utk dibandingkan dgn matrix 21 model
# yang sudah ada (test AP50=57-61% utk FocalNet-L/SwinB terbaik).
# Self-contained: dijalankan via scripts/maskrcnn_rgbd_dbh/train.py (tidak menyentuh repo MaskDINO).
# CATATAN:
#  - 4-channel: detectron2 otomatis bikin stem 4-ch karena len(PIXEL_MEAN)==4.
#  - MODEL.WEIGHTS = bobot R50-FPN COCO yang sudah di-inflate conv1 3->4 ch
#    (dibuat dari mask_rcnn_R_50_FPN_3x_coco.pkl yang diunduh manual via curl krn urllib
#    gagal SSL cert di compute node; jangan jalankan ulang inflate_weights.py tanpa fix itu).
#  - Normalisasi RGB+depth meniru RGBD MaskDINO (ImageNet mean/std + depth 118.1/50.8).
#  - DBH head = ROI head regresi (DBHROIHeads), target log1p(dbh_mm), dbh=0 (vine) di-skip.
#  - BELUM PERNAH DIJALANKAN DI GPU sebelum sesi ini — smoke test WAJIB sebelum full run.

MODEL:
  WEIGHTS: "/scratch2/pr65/anur0018/pretrained_weights/mask_rcnn_R_50_FPN_3x_rgbd4ch.pkl"
  PIXEL_MEAN: [123.675, 116.280, 103.530, 118.1]
  PIXEL_STD:  [58.395, 57.120, 57.375, 50.8]
  ROI_HEADS:
    NAME: "DBHROIHeads"
    NUM_CLASSES: 13
  ROI_DBH_HEAD:
    POOLER_RESOLUTION: 7
    NUM_FC: 2
    FC_DIM: 1024
    LOSS_WEIGHT: 0.5

DATASETS:
  TRAIN: ("combined_inst_rle_f1000_repaired_v4_stratified_train",)
  TEST:  ("combined_inst_rle_f1000_repaired_v4_stratified_val",)

INPUT:
  FORMAT: "RGB"
  MASK_FORMAT: "bitmask"
  USE_DEPTH: True
  DEPTH_DIR: "/scratch2/pr65/anur0018/tree_classification/data/combined/depth_pfm"

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.005
  MAX_ITER: 75000
  STEPS: (60000, 70000)
  WARMUP_ITERS: 1000
  CHECKPOINT_PERIOD: 5000
  AMP:
    ENABLED: True

TEST:
  EVAL_PERIOD: 5000

DATALOADER:
  NUM_WORKERS: 8
  FILTER_EMPTY_ANNOTATIONS: True
