_BASE_: maskdino_SwinB_plantations.yaml

# SwinB Plantation RGB 75k — dataset V4 (exact-match repair, flat-color instance PNG)
# Identik dengan SwinB PL original (57.56%) kecuali dataset: repaired_v4
# Plantation subset diekstrak dari combined_repaired_v4: 1682 train, 352 val images

SEED: 3121

DATASETS:
  TRAIN: ("plantations_inst_rle_f1000_repaired_v4_stratified_train",)
  TEST:  ("plantations_inst_rle_f1000_repaired_v4_stratified_val",)

INPUT:
  IMAGE_SIZE: 640
  MIN_SCALE: 0.4
  MAX_SCALE: 2.0
  MASK_FORMAT: "bitmask"
  DATASET_MAPPER_NAME: "coco_instance_lsj"

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.00003
  MAX_ITER: 75000
  STEPS: (60000, 70000)
  WARMUP_ITERS: 1000
  CHECKPOINT_PERIOD: 5000
  AMP:
    ENABLED: True

TEST:
  EVAL_PERIOD: 5000

DATALOADER:
  NUM_WORKERS: 8
  FILTER_EMPTY_ANNOTATIONS: True
