_BASE_: maskdino_R50_rainforests.yaml

DATASETS:
  TRAIN: ("rainforests_inst_rle_f1000_train",)
  TEST:  ("rainforests_inst_rle_f1000_val",)

INPUT:
  IMAGE_SIZE: 480
  MASK_FORMAT: "bitmask"
  MIN_SCALE: 0.5
  MAX_SCALE: 1.5
  FORMAT: "RGB"
  DATASET_MAPPER_NAME: "coco_instance_lsj"

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.0001
  MAX_ITER: 50000
  STEPS: (40000, 47000)
  WARMUP_ITERS: 200
  CHECKPOINT_PERIOD: 5000
  AMP:
    ENABLED: True

TEST:
  EVAL_PERIOD: 5000

DATALOADER:
  NUM_WORKERS: 8
  FILTER_EMPTY_ANNOTATIONS: True
