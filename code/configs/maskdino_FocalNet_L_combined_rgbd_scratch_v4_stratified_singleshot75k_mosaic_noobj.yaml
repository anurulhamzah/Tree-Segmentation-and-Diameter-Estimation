# EKSPERIMEN SINGLE-SHOT (Varian A — utama, TANPA class-weight)
# ---------------------------------------------------------------------------
# Hipotesis: apakah protokol fine-tune bertahap (base 75k -> +mosaic -> +noobj)
# itu perlu, atau cukup SATU run 75k dari scratch dgn mosaic+noobj baked-in?
# Pembanding: base 75k plain = 57.18%  |  staged 135k (base+mosaic+noobj) = 60.02%.
# Ekspektasi realistis: ~57-59% (augmentasi didapat, tapi total iterasi tetap 75k,
# bukan 135k). Ini taruhan SIMPLICITY/REPRODUCIBILITY, bukan performa.
#
# De-risk instabilitas mosaic-dari-scratch: warmup LR 5000 + fp32 (AMP off, warisan
# base). Kalau training tetap divergen di awal, fallback = 2-fase (10k tanpa mosaic
# dulu, baru nyalakan mosaic) — tapi coba varian ini dulu.
#
# CLASS-WEIGHT SENGAJA TIDAK DIPAKAI di varian utama: kontribusinya ke F1 cuma 6%,
# DAN formula sqrt-inverse-freq justru men-downweight 4 spesies RF terlemah (mereka
# melimpah) sambil upweight plantation langka. Lihat varian B utk ablasi class-weight.
_BASE_: maskdino_FocalNet_L_combined_rle_f1000_rgbd_scratch_repaired_v4_stratified_75k.yaml
MODEL:
  MaskDINO:
    NO_OBJECT_WEIGHT: 0.05      # lawan under-detection (dari staged noobj05)
INPUT:
  MOSAIC_PROB: 0.5             # crowd-aug baked-in dari iter 0
# SOLVER diwarisi penuh dari base: WEIGHTS="" (scratch), MAX_ITER 75000,
# WARMUP_ITERS 5000, BASE_LR 1e-4, STEPS (60000,70000), WEIGHT_DECAY 0.05,
# BACKBONE_MULTIPLIER 1.0, AMP.ENABLED False.
