_BASE_: /scratch2/pr65/anur0018/tree_classification/configs/maskdino_R50_rainforests.yaml

# R50 Combined Repaired V4 75k — RGB Pretrain, dataset V4 (exact-match repair)
# Identik dengan R50 Combined Repaired (43.47%) kecuali dataset: repaired_v4
# Dataset V4 = flat-color instance PNG + exact pixel match → full canopy coverage

DATASETS:
  TRAIN: ("combined_inst_rle_f1000_repaired_v4_stratified_train",)
  TEST:  ("combined_inst_rle_f1000_repaired_v4_stratified_val",)

MODEL:
  SEM_SEG_HEAD:
    NUM_CLASSES: 13

INPUT:
  IMAGE_SIZE: 640
  MIN_SCALE: 0.4
  MAX_SCALE: 2.0
  FORMAT: "RGB"
  DATASET_MAPPER_NAME: "coco_instance_lsj"
  MASK_FORMAT: "bitmask"

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.0001
  MAX_ITER: 75000
  STEPS: (60000, 70000)
  WARMUP_ITERS: 200
  CHECKPOINT_PERIOD: 5000
  AMP:
    ENABLED: True

TEST:
  EVAL_PERIOD: 5000

DATALOADER:
  NUM_WORKERS: 8
  FILTER_EMPTY_ANNOTATIONS: True