_BASE_: /scratch2/pr65/anur0018/MaskDINO/MaskDINO/configs/coco/instance-segmentation/Base-COCO-InstanceSegmentation.yaml

# FocalNet-L Combined RGBD 75k — FROM SCRATCH + anotasi REPAIRED, depth channel SAJA (tanpa DBH head)
# Melengkapi keluarga from-scratch (permintaan pembimbing: train hanya dgn data kita, tanpa ImageNet):
#   sudah ada R50/SwinT/SwinB rgbd_scratch_repaired → ini menambah backbone FocalNet-L.
# Beda dari FocalNet RGB pretrained (maskdino_FocalNet_L_combined_rle_f1000_75k.yaml):
#   - WEIGHTS="" (random init, no pretrained)
#   - FOCAL.in_chans=4 (butuh patch config.py: cfg.MODEL.FOCAL.in_chans; D2FocalNet TIDAK auto-4ch dari PIXEL_MEAN)
#   - 4-ch depth (PIXEL_MEAN/STD len 4: depth mean=118.1 std=50.8), USE_DEPTH + mapper lsj_dbh, DBH_WEIGHT=0.0
#   - BACKBONE_MULTIPLIER 1.0 (backbone belajar penuh), WARMUP 5000, AMP OFF (fp32 anti-NaN) — resep scratch
#   - DATASETS → combined_inst_rle_f1000_repaired_{train,val}
# LR 1e-4 = LR terbaik FocalNet (sweep p3). EKSPEKTASI: backbone besar from-scratch di ~4k gambar → papan tengah.
# CATATAN OOM: FocalNet-L (~200M) + fp32 + batch 4 berat di L40S 48GB. Bila OOM → turunkan IMS_PER_BATCH ke 2.

SEED: 3121

MODEL:
  META_ARCHITECTURE: "MaskDINO"
  WEIGHTS: ""
  BACKBONE:
    NAME: "D2FocalNet"
  FOCAL:
    modelname: "focalnet_L_384_22k"
    out_features: ["res2", "res3", "res4", "res5"]
    in_chans: 4
  PIXEL_MEAN: [ 123.675, 116.280, 103.530, 118.1 ]
  PIXEL_STD: [ 58.395, 57.120, 57.375, 50.8 ]
  SEM_SEG_HEAD:
    NAME: "MaskDINOHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 13
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    PIXEL_DECODER_NAME: "MaskDINOEncoder"
    DIM_FEEDFORWARD: 2048
    NUM_FEATURE_LEVELS: 4
    TOTAL_NUM_FEATURE_LEVELS: 5
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res2", "res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 6
    FEATURE_ORDER: "low2high"
  MaskDINO:
    TRANSFORMER_DECODER_NAME: "MaskDINODecoder"
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 0.1
    CLASS_WEIGHT: 4.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    BOX_WEIGHT: 5.0
    GIOU_WEIGHT: 2.0
    DBH_WEIGHT: 0.0
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 300
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 2048
    ENC_LAYERS: 0
    PRE_NORM: False
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    DEC_LAYERS: 9
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    EVAL_FLAG: 1
    INITIAL_PRED: True
    TWO_STAGE: True
    DN: "seg"
    DN_NUM: 100
    INITIALIZE_BOX_TYPE: 'bitmask'
    BOX_LOSS: True
    TEST:
      SEMANTIC_ON: False
      INSTANCE_ON: True
      PANOPTIC_ON: False
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.25

DATASETS:
  TRAIN: ("combined_inst_rle_f1000_repaired_train",)
  TEST:  ("combined_inst_rle_f1000_repaired_val",)

INPUT:
  IMAGE_SIZE: 640
  MASK_FORMAT: "bitmask"
  MIN_SCALE: 0.4
  MAX_SCALE: 2.0
  FORMAT: "RGB"
  DATASET_MAPPER_NAME: "coco_instance_lsj_dbh"
  USE_DEPTH: True
  DEPTH_DIR: "/scratch2/pr65/anur0018/tree_classification/data/combined/depth_pfm"

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.0001
  MAX_ITER: 75000
  STEPS: (60000, 70000)
  WARMUP_ITERS: 5000
  CHECKPOINT_PERIOD: 5000
  WEIGHT_DECAY: 0.05
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: 1.0
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0
  AMP:
    ENABLED: False   # from-scratch: fp32 untuk hindari NaN

TEST:
  EVAL_PERIOD: 5000

DATALOADER:
  NUM_WORKERS: 8
  FILTER_EMPTY_ANNOTATIONS: True