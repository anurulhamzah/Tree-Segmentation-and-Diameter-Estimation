_BASE_: /scratch2/pr65/anur0018/MaskDINO/MaskDINO/configs/coco/instance-segmentation/maskdino_R50_bs16_50ep_3s.yaml

DATASETS:
  TRAIN: ("plantations_inst_rle_train",)
  TEST:  ("plantations_inst_rle_val",)

MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl"
  SEM_SEG_HEAD:
    NUM_CLASSES: 7

INPUT:
  IMAGE_SIZE: 512
  MIN_SCALE: 0.5
  MAX_SCALE: 2.0
  FORMAT: "RGB"
  DATASET_MAPPER_NAME: "coco_instance_lsj"

SOLVER:
  IMS_PER_BATCH: 8
  BASE_LR: 0.0001
  MAX_ITER: 20000
  STEPS: (15000, 18000)
  WARMUP_ITERS: 100
  CHECKPOINT_PERIOD: 2000
  AMP:
    ENABLED: True

TEST:
  EVAL_PERIOD: 2000

DATALOADER:
  NUM_WORKERS: 4
  FILTER_EMPTY_ANNOTATIONS: True

OUTPUT_DIR: "./output/maskdino_R50_plantations"
